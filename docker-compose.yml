services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]

  ml_service:
    build: ./ml_service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on: [redis]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      FRONTEND_URL: http://localhost
      ML_API_URL: http://ml_service:5001
      REDIS_HOST: redis
    ports: ["5000:5000"]
    depends_on: [redis, ml_service]

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    ports: ["3000:80"]

volumes:
  redis_data:
